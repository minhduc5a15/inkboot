version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: inkboot_admin
      POSTGRES_PASSWORD: inkboot_password
      POSTGRES_DB: inkboot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:3000"
    environment:
      - DATABASE_URL=postgresql://inkboot_admin:inkboot_password@db:5432/inkboot
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:80"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - server

volumes:
  postgres_data:
